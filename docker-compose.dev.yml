version: "3.9"

services:
  # ─── PostgreSQL 16 + PostGIS ──────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: signal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal_urbain
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_urbain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: signal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: signal_network
