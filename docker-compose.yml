version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: signal_postgres
    restart: always
    environment:
      POSTGRES_DB: signal_urbain
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-signal_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_urbain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: signal_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-signal_redis}

  minio:
    image: minio/minio:latest
    container_name: signal_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-signal_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-signal_minio_secret}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: signal_api
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://signal:${DB_PASSWORD:-signal_password}@postgres:5432/signal_urbain
      REDIS_URL: redis://:${REDIS_PASSWORD:-signal_redis}@redis:6379
      MINIO_ENDPOINT: minio
    deploy:
      replicas: 2

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: signal_dashboard
    restart: always

  nginx:
    image: nginx:alpine
    container_name: signal_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - dashboard

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: signal_network
